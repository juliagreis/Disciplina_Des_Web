<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Minha Loja</title>
</head>

<body>

    <header>
        <h1>Produtos</h1>

        <p>
            Confira nossos produtos disponíveis em nossa loja.
        </p>
    </header>

    <main>

        <section>
            <h2>Produtos disponíveis</h2>

            <div>
                <img
                    src="https://fujiokadistribuidor.vteximg.com.br/arquivos/ids/236048"
                    alt="Foto de um notebook"
                >

                <h3>Notebook</h3>

                <p>R$ 3.499,90</p>

                <a href="https://shop.samsung.com/br/samsung-book-intel-core-i5-1135g7-windows-11-home-8gb-256gb-ssd-intel-iris-xe-15-6-full-hd-led-181kg/p">
                    Ver detalhes
                </a>
            </div>

            <div>
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5Y3LDUy7RkWhmBscnHw9GVq3X7VK3p75jrovSvaxrKg&s=10"
                    alt="Foto de um smartphone"
                >

                <h3>Smartphone</h3>

                <p>R$ 1.999,90</p>

                <a href="https://www.samsung.com/pt/smartphones/galaxy-a/galaxy-a53-5g-awesome-blue-128gb-sm-a536blbneub/?srsltid=AfmBOopCLhpQauI9_4MPSxEStgl0LL2fEs3sBSL5h7U1weWQ_SQtGeEM">
                    Ver detalhes
                </a>
            </div>

            <div>
                <img
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRg7NLipCfyy3p8LNaiEJqTXsjS6uBVq20ZsffyiBN6Vw&s=10"
                    alt="Foto de um fone de ouvido"
                >

                <h3>Fone de ouvido</h3>

                <p>R$ 299,90</p>

                <a href="https://www.saramonic.com.br/fone-de-ouvido-sem-fio-bluetooth-5.0-com-tecnologia-anc-de-cancelamento-de-ruido/sr-bh600/-p?srsltid=AfmBOooCfHIyMTsySgBTYGLFkyrUZ8995GwhYSWVIwVsJ85rvn4UWYj3">
                    Ver detalhes
                </a>
            </div>

        </section>

        <section>
            <h2>Cadastrar novo produto</h2>

            <form action="#" method="post">

                <p>
                    <label for="nome">Nome do produto:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        required
                    >
                </p>

                <p>
                    <label for="preco">Preço:</label>
                    <input
                        type="number"
                        id="preco"
                        name="preco"
                        step="0.01"
                        min="0"
                        required
                    >
                </p>

                <p>
                    <label for="imagem">URL da imagem:</label>
                    <input
                        type="url"
                        id="imagem"
                        name="imagem"
                        required
                    >
                </p>

                <p>
                    <label for="detalhes">Link para detalhes:</label>
                    <input
                        type="url"
                        id="detalhes"
                        name="detalhes"
                        required
                    >
                </p>

                <button type="submit">
                    Cadastrar produto
                </button>

            </form>
        </section>

    </main>

    <footer>
        <p>Minha Loja</p>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
